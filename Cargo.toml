[workspace]
resolver = "2"
members = ["crates/scheme-core", "crates/scheme-ffi", "crates/schemed"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
redb = "2"
tempfile = "3"
