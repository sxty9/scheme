[package]
name = "scheme-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "scheme-ffi — C-ABI für das IN-PROZESS-Embedding von scheme (eine Vertrauenszone): cdylib + staticlib, die die veränderbaren, pfadbasierten scheme-Primitive über opake Handles + extern \"C\" exponieren. Jede Grenzen-Funktion fängt Panics ab (catch_unwind) — ein Panic über die C-ABI wäre UB."

[lib]
name = "scheme_ffi"
# cdylib: dynamisch ladbar (Go/cgo, Python, dlopen). staticlib: zum Einbetten in
# ein C/C++-/cgo-Programm. rlib: damit der Rust-Integrationstest gegen die
# extern-"C"-Symbole linken kann.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
scheme-core = { path = "../scheme-core" }

[dev-dependencies]
tempfile = { workspace = true }
